# Bramka calego projektu: trzy wtyczki naraz.
#
# Poprzednia wersja tego pliku (mp-lead-intake-ci.yml) wyzwalala sie wylacznie
# na galezi `mp-lead-intake` i sprawdzala wylacznie te jedna wtyczke. Po scaleniu
# galezi do `main` zostawialo to komplet dostawy — 976 plikow, dwie trzecie kodu —
# calkowicie bez kontroli, a wspolny `.phpcs.xml.dist` nie byl wykonywany nigdy.
name: CI

on:
  push:
    branches: [ main, mp-lead-intake, mp-offer-builder, mp-sales-workflow ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 = deklarowane minimum wtyczek 1 i 3, 8.3 = wersja deweloperska. Obie
        # musza przejsc — inaczej deklaracja zgodnosci jest goloslowna, a wlasnie tak
        # bylo: dopoki krok PHPCS wywracal cala prace przed testami, to sprawdzenie
        # nigdy sie nie wykonalo i nikt nie zauwazyl, ze wtyczka 2 na 7.4 nie wstaje.
        php: [ '7.4', '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install PHPCS / WPCS (composer.json w korzeniu repo)
        run: composer install --no-progress --prefer-dist

      # Vendor wtyczki 2 pominiety swiadomie: to cudzy kod (dompdf i zaleznosci),
      # dolaczony do repozytorium jako zaleznosc runtime, nie nasz do poprawiania.
      - name: PHP syntax check (php -l, trzy wtyczki)
        run: |
          find mp-lead-intake mp-offer-builder mp-sales-workflow \
            -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -- php -l

      - name: PHPCS / WPCS (wspolny .phpcs.xml.dist w korzeniu repo)
        run: vendor/bin/phpcs

      - name: Weryfikacja procesu — wtyczka 1
        run: php mp-lead-intake/tests/process-harness/run-process.php

      # Wtyczka 2 dolacza dompdf 3.1, ktory wymaga PHP >= 8.1 — jej autoloader
      # KONCZY SIE FATALEM na 7.4. Naglowek wtyczki mowil dotad „Requires PHP: 7.4"
      # i bylo to nieprawda; teraz mowi 8.1, a ten krok nie udaje, ze da sie ja
      # uruchomic tam, gdzie sie nie da. Wtyczki 1 i 3 nadal musza przejsc na 7.4.
      - name: Weryfikacja procesu — wtyczka 2
        if: matrix.php != '7.4'
        run: php mp-offer-builder/tests/process-harness/run-process.php

  # Wtyczka 3 nie miala w CI ZADNEGO testu wykonywanego (U-8). Nie z przeoczenia:
  # jej testy wymagaja WordPressa z baza, a harnessy wtyczek 1 i 2 chodza na
  # wlasnym shimie i obchodza sie bez niego. Skutek byl jednak taki sam jak
  # przeoczenie — trzecia wtyczka i cala integracja miedzy trzema wtyczkami
  # przechodzily przez bramke na podstawie skladni i stylu kodu.
  #
  # Ocene werdyktu robi ten sam skrypt co lokalnie (tools/test-env/regresja.sh),
  # tylko z innym klientem WP-CLI. Dwie kopie tej samej reguly rozjechalyby sie
  # przy pierwszym nowym formacie wyniku.
  integracja:
    name: Testy na WordPressie (trzy wtyczki)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, zip
          tools: wp-cli
          coverage: none

      - name: WordPress + trzy wtyczki
        run: |
          set -eu
          wp core download --path=wp --version=latest
          wp config create --path=wp \
            --dbname=wp_test --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp config set --path=wp MP_SW_LINK_KEY 'ci-link-key-32-znaki-na-potrzeby-ci' --type=constant
          wp config set --path=wp MP_HASH_PEPPER 'ci-pepper-32-znaki-na-potrzeby-ci-x' --type=constant
          wp core install --path=wp \
            --url=http://localhost --title="CI" \
            --admin_user=admin --admin_password=admin --admin_email=ci@example.test \
            --skip-email
          # WooCommerce jest TWARDA zaleznoscia wtyczki 2 (naglowek `Requires
          # Plugins: woocommerce`, a bootstrap sam sie dezaktywuje przy jej braku).
          # Bez tej linii aktywowaly sie dwie wtyczki z trzech i to wlasnie
          # przewracalo cale zadanie.
          wp plugin install woocommerce --activate --path=wp
          # Wtyczki ida z checkoutu, nie z kopii: test ma sprawdzac TEN kod.
          for w in mp-lead-intake mp-offer-builder mp-sales-workflow; do
            ln -s "$PWD/$w" "wp/wp-content/plugins/$w"
          done
          # Kolejnosc 1 → 2 → 3, ta sama co w bramce wydania. Role sa wspoldzielone
          # miedzy wtyczkami 1 i 3 (U-15), wiec kolejnosc aktywacji ma znaczenie
          # i wlasnie dlatego jest tu ustalona jawnie.
          wp plugin activate mp-lead-intake mp-offer-builder mp-sales-workflow --path=wp

      - name: Pelna regresja (wszystkie wersjonowane pliki testowe)
        env:
          MP_WP_CMD: wp --allow-root --path=wp
          # Wzgledem katalogu biezacego, nie --path: `wp eval-file` szuka pliku
          # w CWD. Lokalnie kontener startuje w /var/www/html i przedrostek jest
          # krotszy — tu stoimy w korzeniu checkoutu.
          MP_PLUGINS_PATH: wp/wp-content/plugins/
          # Harnessy wtyczek 1 i 2 chodza tu na PHP z runnera, nie na przenosnym
          # binarium ze srodowiska lokalnego.
          MP_PHP: php
        run: tools/test-env/regresja.sh
